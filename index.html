<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 90%;
            position: relative;
            z-index: 10;
        }

        img {
            width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
            border-radius: 6px;
            font-size: 20px;
            padding: 12px 24px;
            margin: 0 10px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Приваблива кнопка Yes */
        #left {
            --scale: 1;
            background: linear-gradient(45deg, #ff4da6, #ffccff);
            border: none;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 77, 166, 0.8), 0 0 40px rgba(255, 204, 255, 0.6);
            animation: pulse 1.5s infinite;
            transform: scale(var(--scale));
        }

            #left:hover {
                transform: scale(calc(var(--scale) * 1.2)) rotate(-3deg);
                box-shadow: 0 0 30px rgba(255, 77, 166, 1), 0 0 60px rgba(255, 204, 255, 0.9);
            }

        @keyframes pulse {
            0% {
                transform: scale(calc(var(--scale) * 1));
            }

            50% {
                transform: scale(calc(var(--scale) * 1.1));
            }

            100% {
                transform: scale(calc(var(--scale) * 1));
            }
        }

        /* «Так собі» кнопка No */
        #right {
            background: #e6e6e6;
            border: 1px solid #999;
            color: #555;
            opacity: 0.6;
            transition: opacity 0.8s ease;
        }

            #right.fade-out {
                opacity: 0;
            }

        .heart {
            position: absolute;
            width: 32px;
            height: 32px;
            background-image: url("minecraft-heart.png");
            background-size: cover;
            animation: floatUp 6s linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="gif" src="minion-minion-loves.gif" alt="photo"><br>
        <div id="text">Will you be my valentine?</div><br>
        <button id="left">Yes 💖</button>
        <button id="right">No</button>
    </div>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
        Ваш браузер не підтримує аудіо.
    </audio>

    <script>
        const left = document.getElementById("left");
        const right = document.getElementById("right");
        const gif = document.getElementById("gif");
        const text = document.getElementById("text");
        const music = document.getElementById("bg-music");

        let clicks = 0;

        const texts = [
        "Are you sure?",
        "Are you sure \nyou're sure?",
        "You better say yes",
        "Cmmon pleaseeee",
        "Just press yes"
        ];

        right.onclick = () => {
        if (clicks < texts.length) {
        right.innerText = texts[clicks];
        left.style.setProperty("--scale", 1.5 + clicks * 0.5);
        clicks++;

        // якщо це останнє натискання — плавно зникає кнопка No
        if (clicks === texts.length) {
        right.classList.add("fade-out");
        setTimeout(() => right.remove(), 800); // видаляємо після анімації
        }
        }
        };

        left.onclick = () => {
        gif.src = "fireworks-exploding-heart.gif";
        text.innerText = "YAAYYY!!!";
        left.style.display = "none";
        right.style.display = "none";

        // Запуск музики
        music.play();

        // Зміна фону
        document.body.style.background = "pink";

        // Безкінечні сердечка
        setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
        heart.remove();
        }, 6000);
        }, 500);
        };
    </script>
</body>
</html>
